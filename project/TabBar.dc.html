<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;font-family:Geist,system-ui,sans-serif">
<div style="position:absolute;right:20px;bottom:106px;width:56px;height:56px;border-radius:28px;background:var(--amber,#D4A24C);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(212,162,76,.32), inset 0 1px 0 rgba(255,255,255,.35);pointer-events:auto;cursor:pointer">
<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="#17130B" stroke-width="2" stroke-linecap="round"></path></svg>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:90px;background:var(--tabbg,rgba(14,15,17,.94));backdrop-filter:blur(20px);border-top:1px solid var(--line,#2A2D31);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px 0;pointer-events:auto">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:{{ c.home }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg>
<span style="font-size:11px;font-weight:500">Home</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:{{ c.waste }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10z"></path></svg>
<span style="font-size:11px;font-weight:500">Waste</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:{{ c.networth }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 17.5a8 8 0 1 1 13 0"></path><path d="M12 13.5l3.5-4"></path></svg>
<span style="font-size:11px;font-weight:500">Net Worth</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:{{ c.bills }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="5.5" width="16" height="14" rx="3"></rect><path d="M4 10h16M9 3.5v3M15 3.5v3" stroke-linecap="round"></path></svg>
<span style="font-size:11px;font-weight:500">Bills</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:{{ c.coach }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3.5l2 6.5 6.5 2-6.5 2-2 6.5-2-6.5-6.5-2 6.5-2z"></path></svg>
<span style="font-size:11px;font-weight:500">Coach</span></div>
</div>
<div style="position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--text,#EDEAE4);opacity:.85"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:160},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;waste&quot;,&quot;networth&quot;,&quot;bills&quot;,&quot;coach&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const c = {};
    ['home', 'waste', 'networth', 'bills', 'coach'].forEach(k => c[k] = k === a ? 'var(--amber,#D4A24C)' : 'var(--muted2,#8A867F)');
    return { c };
  }
}
</script>
</body>
</html>
